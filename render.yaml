services:
  - type: web
    runtime: python
    name: travel-vibe-api
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: ./scripts/render-start.sh
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: travel-vibe-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: travel-vibe-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CLERK_SECRET_KEY
        sync: false

  - type: web
    runtime: static
    name: travel-vibe-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: travel-vibe-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: travel-vibe-db
    plan: free
    region: ohio
    databaseName: travelvibe
    user: travelvibe
    ipAllowList: []
